<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f6fb2"/>
      <stop offset="100%" stop-color="#164a78"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b2540" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- the record: a document, held by the person -->
  <g filter="url(#soft)">
    <rect x="132" y="96" width="248" height="286" rx="22" fill="#ffffff"/>
    <!-- folded corner, so it reads as paper rather than a card -->
    <path d="M330 96 h50 v50 z" fill="#dbe7f2"/>
  </g>

  <!-- heartbeat line: the "fun" note, still clinical -->
  <polyline points="164,214 202,214 218,180 240,254 262,206 282,236 296,214 348,214"
            fill="none" stroke="#e5484d" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- record lines -->
  <g fill="#c9d6e4">
    <rect x="164" y="280" width="184" height="15" rx="7.5"/>
    <rect x="164" y="312" width="140" height="15" rx="7.5"/>
  </g>

  <!-- download arrow: the whole point of the tool -->
  <g transform="translate(256,392)">
    <circle r="66" fill="#ffffff"/>
    <circle r="66" fill="none" stroke="#164a78" stroke-width="6" opacity="0.15"/>
    <path d="M0,-30 V16" stroke="#1f6fb2" stroke-width="17" stroke-linecap="round"/>
    <path d="M-24,-6 L0,20 L24,-6" fill="none" stroke="#1f6fb2" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30,38 H30" stroke="#1f6fb2" stroke-width="17" stroke-linecap="round"/>
  </g>
</svg>
